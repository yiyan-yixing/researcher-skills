# =============================================================================
# 实验2 Phase 1A: IFEval 4-option fix
# =============================================================================
# 目标：消除混淆源 C1（IFEval 2选项 vs 其他4选项）
# 预期：Layer 0 从 ~100% 降至 ~90-95%
# =============================================================================

# --- 模型配置 ---
model:
  name: "Qwen/Qwen2.5-3B"
  device: "cpu"
  torch_dtype: "float16"

# --- 数据配置 ---
data:
  num_samples: 100                # 每个 mini-benchmark 采样题数（Phase 1 翻倍）
  seed: 42
  max_input_length: 512
  # GSM8K
  gsm8k:
    dataset_name: "gsm8k"
    subset: "main"
    split: "test"
  # MMLU
  mmlu:
    dataset_name: "cais/mmlu"
    subset: "all"
    split: "test"
  # TriviaQA
  triviaqa:
    dataset_name: "trivia_qa"
    subset: "rc.nocontext"
    split: "validation"
  # IFEval (4-option format)
  ifeval:
    dataset_name: "google/IFEval"
    split: "train"

# --- 探针配置 ---
probe:
  type: "logistic_regression"
  C: 1.0
  max_iter: 1000
  cv_folds: 5
  test_size: 0.2
  random_state: 42

# --- 消融配置 ---
ablation:
  layer_selection: "best_probe"
  strength: 50.0
  eval_batch_size: 8

# --- 实验流程控制 ---
experiment:
  run_exp0: true
  run_exp1: false               # Phase 1A 只跑探针，不跑消融
  skip_if_exists: false

# --- 输出配置 ---
output:
  results_dir: "results/phase1a"  # 独立子目录，不覆盖实验0/1
  save_hidden_states: true
  save_predictions: true

# --- 数据文件路径 ---
data_file: "data/all_samples_v2.json"

# --- 放弃条件 ---
abort_criteria:
  exp0_min_accuracy: 0.60
